<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Acesse os tutoriais de treinamento dos sistemas da Icavel."
    />
    <title>Treinamentos | Icavel</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="min-h-screen bg-slate-50 text-slate-800 antialiased">
    <header class="border-b border-slate-200 bg-white">
      <div class="mx-auto flex max-w-5xl items-center justify-between px-6 py-4">
        <a href="index.html" class="font-semibold tracking-tight text-slate-900">
          Icavel <span class="font-normal text-slate-500">/ Treinamentos</span>
        </a>
        <span class="text-sm text-slate-500">Central de aprendizado</span>
      </div>
    </header>

    <main class="mx-auto max-w-3xl px-6 py-16 sm:py-24">
      <p class="mb-3 text-sm font-medium uppercase tracking-wide text-blue-700">
        Guias rápidos
      </p>
      <h1 class="text-4xl font-semibold tracking-tight text-slate-950 sm:text-5xl">
        Hub de treinamentos
      </h1>
      <p class="mt-5 max-w-2xl text-lg leading-8 text-slate-600">
        Escolha um sistema para abrir o tutorial. Cada guia reúne orientações
        práticas para você acompanhar no seu ritmo.
      </p>

      <section aria-labelledby="courses-title" class="mt-12">
        <h2 id="courses-title" class="mb-4 text-sm font-semibold text-slate-500">
          Tutoriais disponíveis
        </h2>
        <ul class="divide-y divide-slate-200 border-y border-slate-200 bg-white">
          <li>
            <a
              href="agenda.html"
              class="group flex items-center justify-between gap-6 px-5 py-5 transition hover:bg-slate-50 focus-visible:outline-2 focus-visible:outline-offset-[-2px] focus-visible:outline-blue-700"
            >
              <span>
                <span class="block font-medium text-slate-900">Agenda Icavel</span>
                <span class="mt-1 block text-sm text-slate-500">
                  Organização do dia a dia de trabalho
                </span>
              </span>
              <span aria-hidden="true" class="text-slate-400 transition group-hover:translate-x-1 group-hover:text-blue-700">→</span>
            </a>
          </li>
  
        </ul>
      </section>
    </main>
  </body>
</html>
